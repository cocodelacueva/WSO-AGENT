[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wso"
version = "0.4.0"
description = "White Suit Operator — agente de programación de terminal (local o cloud)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "White Suit Studio" },
]
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # Input del REPL: bracketed paste (pegado multilínea sin perder líneas),
    # historial y edición de línea. Reemplaza el input canónico de la stdlib.
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Cloud providers (instalá solo el que vayas a usar)
anthropic = ["anthropic>=0.100"]
# OpenAI y cualquier endpoint compatible (OpenRouter, Groq, Gemini, vLLM, ...)
openai = ["openai>=1.50"]
# Meta-extra: todo lo opcional de una.
all = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "anthropic>=0.100",
    "openai>=1.50",
]

[project.scripts]
wso = "wso.main:main"

[tool.setuptools.packages.find]
include = ["wso*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
