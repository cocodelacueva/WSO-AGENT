[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wso"
version = "0.1.0"
description = "White Suit Operator — agente local de terminal para tareas de estudio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "White Suit Studio" },
]
dependencies = [
    "ollama>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # reportlab: genera PDFs con texto extraíble para los tests de read_pdf.
    "reportlab>=4.0",
]
# Cloud providers (instalá solo el que vayas a usar)
google = ["google-generativeai>=0.8"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
# Tools de Office (instalá si vas a generar/leer .pptx, .xlsx, .pdf, .docx)
office = [
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
]
# Browser bridge (v0.3): attach por CDP a tu Chrome real vía Playwright.
browser = ["playwright>=1.40"]
# Meta-extra: todo lo opcional de una. Útil para desarrollo activo.
# Equivalente a [dev,office,google,anthropic,openai].
all = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "reportlab>=4.0",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "google-generativeai>=0.8",
    "anthropic>=0.40",
    "openai>=1.50",
    "playwright>=1.40",
]

[project.scripts]
wso = "wso.main:main"

[tool.setuptools.packages.find]
include = ["wso*"]
exclude = ["tests*", "workspace*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
